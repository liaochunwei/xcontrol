[package]
name = "xcontrol-cli"
description = "headless / 调试入口（bin）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 依赖方向（docs/08 §1）：cli → 所有 crate；无 gpui（headless）。
[dependencies]
xcontrol-proto.workspace = true
# std-paths：--status 读默认配置路径/数据目录（default_config_path/default_data_dir），
# 与 app 同款开启方式（11-17-m3-status）。
xcontrol-config = { workspace = true, features = ["std-paths"] }
xcontrol-core.workspace = true
xcontrol-net.workspace = true
xcontrol-input.workspace = true
xcontrol-clipboard.workspace = true
xcontrol-tray.workspace = true
# --status（NFR-8）：bin 顶层 anyhow（error-handling.md 规则 2）+ serde_json
# （--json 机器可读输出，design.md 定夺）。
anyhow.workspace = true
serde_json.workspace = true

# 与 xcontrol-app 相同的平台 feature 聚合口，供 headless 场景按目标平台选择。
[features]
macos = ["xcontrol-input/macos", "xcontrol-clipboard/macos", "xcontrol-tray/macos"]
windows = ["xcontrol-input/windows", "xcontrol-clipboard/windows", "xcontrol-tray/windows"]
x11 = ["xcontrol-input/x11", "xcontrol-clipboard/x11", "xcontrol-tray/x11"]
wayland = ["xcontrol-input/wayland", "xcontrol-clipboard/wayland", "xcontrol-tray/wayland"]

[lints]
workspace = true
