[package]
name = "xcontrol-core"
description = "无 IO 的核心状态机：会话、屏幕布局、事件路由、映射引擎"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 依赖方向红线（docs/08 §1）：仅允许 xcontrol-proto 与 xcontrol-config（+ thiserror/blake3
# 已过审登记），无 IO、无平台 API、无 tokio。
[dependencies]
xcontrol-proto.workspace = true
xcontrol-config.workspace = true
thiserror.workspace = true
# blake3：session_id = BLAKE3(hs_hash)[0..16]（docs/02 §3.3）；纯软实现，无 I/O（红线不受影响）。
blake3.workspace = true

[features]
# 回环集成测试入口（docs/08 §4：cargo test -p xcontrol-core --features mock-platform）：
# 进程内 host+client 对接 mock 平台层，跑完整握手→事件→剪贴板流程。
mock-platform = []

[lints]
workspace = true
